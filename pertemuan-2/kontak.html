<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak saya</title>
</head>
<body>
    <header>
        <h2>Formulir Kontak</h2>
    </header>

    <hr>

    <main>
        <section>
            <h2>Kirim pesan atau penawaran Anda:</h2>

            <form action="">
                <p>
                    <label for="nama">Nama</label>
                    <input type="text" id="nama">
                </p>

                <p>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </p>

                <p>
                    <label for="jenis_layanan">Jenis Layanan</label>
                    <select name="jenis_layanan" id="jenis_layanan">
                        <option value="">--Pilih Layanan--</option>
                        <option value="web">Pembuatan web</option>
                        <option value="aplikasi">Pembuatan aplikasi</option>
                        <option value="lainya">Lain-lain</option>
                    </select>
                </p>
            </form>

            <p>
                <textarea name="pesan" id="pesan" cols="50" rows="6"></textarea>
            </p>

            <button type="submit">Kirim</button>
            <button type="reset">Reset / Batal</button>
        </section>
    </main>

    <hr>

    <footer>
        &copy; Teknik Informatika 2026
    </footer>
</body>
</html>
